services:
  nodejs-server:
    image: nikhilprashar/nikhil-test
    deploy:
      replicas: 5
    restart: unless-stopped
    networks:
      - nikhil-internal
  caddy:
    image: caddy:latest
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    depends_on:
      - nodejs-server
    networks:
      - nikhil-internal

networks:
  nikhil-internal:
    driver: bridge
